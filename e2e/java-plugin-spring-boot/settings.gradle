pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'java-plugin-spring-boot-example'

// By default the app builds against the plugin sources in this repository, so
// it needs no published artifact. Pass -PuseMavenLocal to resolve the plugin
// from ~/.m2 instead (after `./gradlew :lib:publishToMavenLocal` in the SDK
// directory), which is how an application would consume it.
if (!gradle.startParameter.projectProperties.containsKey('useMavenLocal')) {
    includeBuild('../../sdk/@launchdarkly/observability-java') {
        dependencySubstitution {
            substitute module('com.launchdarkly:launchdarkly-java-server-sdk-observability') using project(':lib')
        }
    }
}
