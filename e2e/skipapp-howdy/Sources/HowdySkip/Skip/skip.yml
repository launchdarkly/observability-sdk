# Skip configuration for HowdySkip module
#
# Native Fuse module with bridging so `#if SKIP` Kotlin helpers
# (LaunchDarkly Android) are callable from compiled Swift on Android.

skip:
  mode: 'native'
  bridging: true

# Official LaunchDarkly Android SDKs (mirroring ios-client-sdk and
# swift-launchdarkly-observability on Darwin).
build:
  contents:
    - block: 'dependencies'
      contents:
        - 'implementation("com.launchdarkly:launchdarkly-android-client-sdk:5.15.0")'
        - 'implementation("com.launchdarkly:launchdarkly-observability-android:0.65.1")'
        # The observability AAR pulls OpenTelemetry in at runtime only; this app needs the
        # API on its compile classpath because it holds on to Span instances.
        - 'implementation("io.opentelemetry:opentelemetry-api:1.51.0")'
