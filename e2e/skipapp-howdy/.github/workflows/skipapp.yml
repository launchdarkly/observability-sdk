name: skipapp-howdy
on:
  push:
    branches: '*'
    tags: "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-app:
    runs-on: macos-15-intel
    steps:
      - name: Cache Homebrew packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-packages
      - uses: skiptools/actions/setup-skip@ce9cda538ff1f7517bdd561d6bbbc8be8f502109 # v1
      - uses: actions/checkout@v6
        with:
          path: skipapp-howdy-repo
      - name: Compare howdy-skip template with skipapp-howdy repo
        run: |
          ./skipapp-howdy-repo/scripts/diff_template.sh skipapp-howdy skipapp-howdy-repo
  call-workflow:
    uses: skiptools/actions/.github/workflows/skip-app.yml@ce9cda538ff1f7517bdd561d6bbbc8be8f502109 # v1

