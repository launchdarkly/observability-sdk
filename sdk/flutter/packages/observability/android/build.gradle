group 'com.launchdarkly.launchdarkly_flutter_observability'
version '0.0.0'

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 8.7.2 pulls io.grpc:grpc-netty:1.57.0, which pins netty-codec-http2
        // at 4.1.93.Final (CVE-2023-44487). The BOM aligns every io.netty module.
        classpath platform('io.netty:netty-bom:4.1.137.Final')
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Patched versions of vulnerable AGP 8.7.2 buildscript transitives.
        constraints {
            classpath 'org.bouncycastle:bcprov-jdk18on:1.86'
            classpath 'org.bouncycastle:bcpkix-jdk18on:1.86'
            classpath 'org.bouncycastle:bcutil-jdk18on:1.86'
            classpath 'com.fasterxml.jackson.core:jackson-core:2.18.11'
            classpath 'com.fasterxml.jackson.core:jackson-databind:2.18.11'
            classpath 'com.google.protobuf:protobuf-java:3.25.5'
            classpath 'commons-io:commons-io:2.14.0'
            classpath 'org.apache.commons:commons-compress:1.26.0'
            classpath 'org.bitbucket.b_c:jose4j:0.9.6'
            classpath 'org.jdom:jdom2:2.0.6.1'
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.launchdarkly.launchdarkly_flutter_observability'
    compileSdk 35

    defaultConfig {
        minSdk 24
        // Shipped to consumer apps so their R8/minified release builds don't fail
        // on the compile-only annotations referenced by the bundled OpenTelemetry
        // + Gson stack (see consumer-rules.pro).
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    // Native dependencies mirrored from the LaunchDarkly mobile SDKs (the same
    // stack used by sdk/@launchdarkly/react-native-ld-session-replay and the
    // .NET MAUI bridge in sdk/@launchdarkly/mobile-dotnet).
    implementation "com.launchdarkly:launchdarkly-observability-android:0.68.1"
    // OTel Attributes appears in ObservabilityOptions parameter types; provided
    // at runtime transitively through launchdarkly-observability-android.
    implementation "io.opentelemetry:opentelemetry-api:1.62.0"
    // The observability SDK is compiled against the LaunchDarkly client SDK as
    // `compileOnly` (hosts opt in via `ldClientSdkProvided`), so it does not
    // package the com.launchdarkly.sdk model types. The bridge's `track` path
    // touches LDValue at runtime, so provide the lightweight java-sdk-common
    // (model types only, NOT the feature-flag client). `runtimeOnly` keeps it off
    // this plugin's compile classpath so the plugin stays independent of the
    // flagging SDK. Version mirrors what launchdarkly-android-client-sdk:5.16.0
    // resolves.
    runtimeOnly "com.launchdarkly:launchdarkly-java-sdk-common:2.4.0"
}
