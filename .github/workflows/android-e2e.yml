name: 'Android E2E App Tests'

on:
    push:
        branches: ['main']
        paths:
            - 'e2e/android/**'
            - 'sdk/@launchdarkly/observability-android/**'
            - '.github/workflows/android-e2e.yml'
            - '.github/actions/setup-android-sdk/**'
    pull_request:
        types: [opened, synchronize]
        paths:
            - 'e2e/android/**'
            - 'sdk/@launchdarkly/observability-android/**'
            - '.github/workflows/android-e2e.yml'
            - '.github/actions/setup-android-sdk/**'

permissions:
    contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    test:
        name: E2E Tests
        runs-on: ubuntu-22.04-8core-32gb
        defaults:
            run:
                working-directory: ./e2e/android
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: 17

            - name: Set up Android SDK
              uses: ./.github/actions/setup-android-sdk

            - name: Run unit tests
              run: ./gradlew :app:testComposeDebugUnitTest

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: android-e2e-unit-test-results
                  path: e2e/android/**/build/test-results/**/TEST-*.xml
                  retention-days: 7
