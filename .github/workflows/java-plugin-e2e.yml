name: Java Observability Plugin E2E

on:
    push:
        branches: ['main']
        paths:
            - 'e2e/java-plugin/**'
            - 'sdk/@launchdarkly/observability-java/**'
            - '.github/workflows/java-plugin-e2e.yml'
    pull_request:
        types: [opened, synchronize]
        paths:
            - 'e2e/java-plugin/**'
            - 'sdk/@launchdarkly/observability-java/**'
            - '.github/workflows/java-plugin-e2e.yml'

permissions:
    contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    run:
        name: Run example
        runs-on: ubuntu-22.04-8core-32gb
        defaults:
            run:
                working-directory: ./e2e/java-plugin
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: 21
                  cache: 'gradle'

            - name: Run the self-checking example
              run: make run

            # Starts the HTTP server example offline (no SDK key) and drives
            # every route. The server must come up, answer, and shut down
            # cleanly on SIGTERM with the plugin flushing on the way out.
            - name: Smoke-test the HTTP server example
              run: |
                  make serve > server.log 2>&1 &
                  SERVER_PID=$!
                  for i in $(seq 1 120); do
                      if curl -sf -o /dev/null localhost:8080/; then break; fi
                      if ! kill -0 "$SERVER_PID" 2>/dev/null; then echo "server exited early"; cat server.log; exit 1; fi
                      sleep 1
                  done
                  curl -sf localhost:8080/ || { cat server.log; exit 1; }
                  curl -sf localhost:8080/rolldice || { cat server.log; exit 1; }
                  code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/error)
                  [ "$code" = "500" ] || { echo "expected 500 from /error, got $code"; cat server.log; exit 1; }
                  kill -TERM "$SERVER_PID"
                  wait "$SERVER_PID" || true
                  echo "server example OK"

            - name: Build the dockerized server example
              working-directory: .
              run: docker build -f e2e/java-plugin/Dockerfile -t e2e-java-plugin .
