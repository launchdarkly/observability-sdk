name: Java Observability Plugin E2E

on:
    push:
        branches: ['main']
        paths:
            - 'e2e/java-plugin/**'
            - 'sdk/@launchdarkly/observability-java/**'
            - '.github/workflows/java-plugin-e2e.yml'
    pull_request:
        types: [opened, synchronize]
        paths:
            - 'e2e/java-plugin/**'
            - 'sdk/@launchdarkly/observability-java/**'
            - '.github/workflows/java-plugin-e2e.yml'

permissions:
    contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    run:
        name: Run example
        runs-on: ubuntu-22.04-8core-32gb
        defaults:
            run:
                working-directory: ./e2e/java-plugin
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: 21

            - name: Run the plugin example
              run: make run
